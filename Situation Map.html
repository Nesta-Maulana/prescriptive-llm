<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Situation Map - Enhanced Filtering</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap">
    
    <link rel="stylesheet" href="files/Situation Map/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=location_on" />
</head>
<body>
    <div class="header">
        <h1>Situation Map</h1>
        <p>Advanced Heatmap Visualization Dashboard</p>
    </div>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-card-content">
                    <div class="stat-card-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        </svg>
                    </div>
                    <div class="stat-card-text">
                        <p>Total Events</p>
                        <p id="total-events">1,238</p>
                    </div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-card-content">
                    <div class="stat-card-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2 L2 7 L12 12 L22 7 Z"></path>
                            <path d="M2 17 L12 22 L22 17"></path>
                            <path d="M2 12 L12 17 L22 12"></path>
                        </svg>
                    </div>
                    <div class="stat-card-text">
                        <p>Active Filters</p>
                        <p id="active-filters">0</p>
                    </div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-card-content">
                    <div class="stat-card-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <circle cx="12" cy="12" r="6"></circle>
                            <circle cx="12" cy="12" r="2"></circle>
                        </svg>
                    </div>
                    <div class="stat-card-text">
                        <p>Visible Data Points</p>
                        <p id="visible-points">45</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="map-container">
            <div class="loading" id="loading">
                <div class="spinner"></div>
            </div>

            <div class="status-indicator" id="status-indicator">
                ALL DATA DISPLAYED
            </div>
            
            <div id="map"></div>
            
            <div class="filter-toggle" id="filter-toggle" onclick="toggleFilterPanel()">
                <div class="filter-toggle-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                    </svg>
                </div>
                <span class="filter-toggle-text">FILTERS</span>
            </div>
            
            <div class="control-panel hidden" id="control-panel">
                <h3>ADVANCED FILTERS</h3>
                
                <div class="filter-section">
                    <h4>🔍 SEARCH KATEGORI</h4>
                    <input type="text" class="search-box" id="category-search" placeholder="Cari kategori..." onkeyup="searchCategories()">
                    <div class="filter-buttons" id="category-buttons">
                        <button class="filter-btn" data-category="teroris" onclick="toggleFilter('teroris')">
                            <div style="display: flex; align-items: center;">
                                <div class="filter-color" style="background-color: #ff4444;"></div>
                                <span>Teroris</span>
                            </div>
                            <span class="filter-count" id="count-teroris">0</span>
                        </button>
                        <button class="filter-btn" data-category="spionase" onclick="toggleFilter('spionase')">
                            <div style="display: flex; align-items: center;">
                                <div class="filter-color" style="background-color: #44ff44;"></div>
                                <span>Spionase</span>
                            </div>
                            <span class="filter-count" id="count-spionase">0</span>
                        </button>
                        <button class="filter-btn" data-category="separatisme" onclick="toggleFilter('separatisme')">
                            <div style="display: flex; align-items: center;">
                                <div class="filter-color" style="background-color: #ffff44;"></div>
                                <span>Separatisme</span>
                            </div>
                            <span class="filter-count" id="count-separatisme">0</span>
                        </button>
                        <button class="filter-btn" data-category="sabotase" onclick="toggleFilter('sabotase')">
                            <div style="display: flex; align-items: center;">
                                <div class="filter-color" style="background-color: #4444ff;"></div>
                                <span>Sabotase</span>
                            </div>
                            <span class="filter-count" id="count-sabotase">0</span>
                        </button>
                        <!-- <button class="filter-btn" data-category="infiltrasi" onclick="toggleFilter('infiltrasi')">
                            <div style="display: flex; align-items: center;">
                                <div class="filter-color" style="background-color: #ff44ff;"></div>
                                <span>Infiltrasi</span>
                            </div>
                            <span class="filter-count" id="count-infiltrasi">0</span>
                        </button>
                        <button class="filter-btn" data-category="cyber" onclick="toggleFilter('cyber')">
                            <div style="display: flex; align-items: center;">
                                <div class="filter-color" style="background-color: #44ffff;"></div>
                                <span>Cyber Attack</span>
                            </div>
                            <span class="filter-count" id="count-cyber">0</span>
                        </button> -->
                    </div>
                </div>

                <div class="filter-section">
                    <h4>📅 DATE RANGE PICKER</h4>
                    <div class="date-inputs">
                        <input type="date" class="date-input" id="start-date" onchange="applyDateFilter()">
                        <input type="date" class="date-input" id="end-date" onchange="applyDateFilter()">
                    </div>
                </div>

                <div class="filter-section">
                    <div class="control-buttons">
                        <button class="control-btn" onclick="clearAllFilters()">Clear All Filters</button>
                        <button class="control-btn" onclick="resetView()">Reset View</button>
                        <button class="control-btn" onclick="changeMapStyle()">Change Style</button>
                    </div>
                </div>
            </div>
            
            <div class="legend">
                <h4>Risk Categories</h4>
                <div class="legend-item" onclick="toggleFilter('teroris')">
                    <div class="legend-color" style="background-color: #ff4444;"></div>
                    <span>Teroris</span>
                </div>
                <div class="legend-item" onclick="toggleFilter('spionase')">
                    <div class="legend-color" style="background-color: #44ff44;"></div>
                    <span>Spionase</span>
                </div>
                <div class="legend-item" onclick="toggleFilter('separatisme')">
                    <div class="legend-color" style="background-color: #ffff44;"></div>
                    <span>Separatisme</span>
                </div>
                <div class="legend-item" onclick="toggleFilter('sabotase')">
                    <div class="legend-color" style="background-color: #4444ff;"></div>
                    <span>Sabotase</span>
                </div>
                <!-- <div class="legend-item" onclick="toggleFilter('infiltrasi')">
                    <div class="legend-color" style="background-color: #ff44ff;"></div>
                    <span>Infiltrasi</span>
                </div>
                <div class="legend-item" onclick="toggleFilter('cyber')">
                    <div class="legend-color" style="background-color: #44ffff;"></div>
                    <span>Cyber Attack</span>
                </div> -->
                <div class="legend-item" onclick="clearAllFilters()">
                    <div class="legend-color" style="background-color: #aaaaaa;"></div>
                    <span>No Filter (All Data)</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

    <script src="files/Situation Map/data.js"></script>
</body>
</html>
